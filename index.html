<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>naow | Red Team</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .writeup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .writeup-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 5px;
            transition: transform 0.3s;
        }

        .writeup-card:hover {
            transform: translateY(-5px);
        }

        .date {
            color: #777;
            font-size: 0.9em;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>naow</h1>
        <p>Pentester & Red Team</p>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="maquinas.html">Máquinas</a>
            <a href="about.html">Sobre Mí</a>
        </nav>
    </header>

    <main>
        <section class="intro">
            <h2>Bienvenido/a</h2>
            <p>Este será mi portfolio donde subiré Writeups de máquinas de HackTheBox, DockerLabs y otros desafíos.</p>
        </section>

        <section class="highlights">
            <h2>Últimos Writeups</h2>
            <div class="writeup-grid" id="latest-writeups"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 naow | Contacto: <a href="mailto:naowcs@gmail.com">Contacto</a></p>
    </footer>

    <script>
        const machines = [
            {
                title: "CAP",
                platform: "HackTheBox",
                date: "2026-08-11",
                difficulty: "Media",
                description: "Contraseña vulnerable en los paquetes de Wireshark, elevación ROOT mediante Capabilities",
                link: "machines/cap.html"
            },
            {
                title: "Lame",
                platform: "Hackthebox",
                date: "2026-08-12",
                difficulty: "Fácil",
                description: "Vulnerabilidad version SMB.",
                link: "machines/lame.html"
            },
            {
                title: "Jerry",
                platform: "Hackthebox",
                date: "2026-08-13",
                difficulty: "Fácil",
                description: "Vulnerabilidad en el login y RCE al WAR deploy.",
                link: "machines/jerry.html"
            },
            {
                title: "Blue",
                platform: "Hackthebox",
                date: "2026-08-16",
                difficulty: "Fácil",
                description: "Vulnerabilidad EternalBlue.",
                link: "machines/Blue.html"
            }
        ];

        machines.sort((a, b) => new Date(b.date) - new Date(a.date));

        const latestMachines = machines.slice(0, 3);
        const container = document.getElementById('latest-writeups');

        latestMachines.forEach(machine => {
            const card = `
                <article class="writeup-card">
                    <h3>${machine.title} (${machine.platform})</h3>
                    <p class="date">${formatDate(machine.date)} | Dificultad: ${machine.difficulty}</p>
                    <p>${machine.description}</p>
                    <a href="${machine.link}">Leer más</a>
                </article>
            `;
            container.innerHTML += card;
        });

        function formatDate(dateString) {
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('es-ES', options);
        }
    </script>
</body>
</html>
